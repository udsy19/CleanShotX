name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build & self-tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Self-tests
        run: swift run SuperScreenshotSelfTest
      - name: Extensions
        run: ./scripts/build-extensions.sh
