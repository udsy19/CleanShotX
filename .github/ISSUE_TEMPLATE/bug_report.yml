name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press ⌥⇧4
        2. Drag over …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Shotcraft version
      placeholder: "1.0.0 (Settings → About)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 15.4, MacBook Pro M3"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, recordings or logs
      description: Console.app logs filtered by `com.udsy.shotcraft` help a lot.
