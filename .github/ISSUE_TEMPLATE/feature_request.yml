name: Feature request
description: Suggest an idea for Super Screenshot
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the workflow or problem rather than a specific solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Super Screenshot help?
  - type: textarea
    id: context
    attributes:
      label: Anything else? (mockups, examples from other apps)
